name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares >=3.11; CI pins the two newest supported
        # interpreters so a new syntax or stdlib assumption fails here.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the harness with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run the suite (the 100 percent coverage gate lives in pyproject)
        run: python -m pytest
      - name: Start the HTTP candidate reference server
        env:
          EVALH_HTTP_CONFORMANCE_BASE_URL: http://127.0.0.1:8765
        run: |
          set -euo pipefail
          # The endpoint lives in one environment variable so the port cannot
          # drift between this process and the conformance runner below.
          PORT="$(python -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["EVALH_HTTP_CONFORMANCE_BASE_URL"]).port)')"
          nohup python examples/http_candidate_server.py --port "$PORT" \
            > /tmp/http-candidate-server.log 2>&1 &
          python - "$PORT" <<'PY'
          import socket, sys, time

          port = int(sys.argv[1])
          deadline = time.time() + 10
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.05)
          else:
              raise SystemExit(
                  f"candidate server did not start on 127.0.0.1:{port}"
              )
          PY
      - name: Start the provider reference stub
        env:
          EVALH_PROVIDER_CONFORMANCE_BASE_URL: http://127.0.0.1:8770
        run: |
          set -euo pipefail
          # The provider rows read the same variable the stub binds, so the
          # port cannot drift between the process and the conformance runner.
          PORT="$(python -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["EVALH_PROVIDER_CONFORMANCE_BASE_URL"]).port)')"
          nohup python examples/provider_server.py --port "$PORT" \
            > /tmp/provider-server.log 2>&1 &
          python - "$PORT" <<'PY'
          import socket, sys, time

          port = int(sys.argv[1])
          deadline = time.time() + 10
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.05)
          else:
              raise SystemExit(
                  f"provider server did not start on 127.0.0.1:{port}"
              )
          PY
      - name: Run the first-party adapter conformance suite
        env:
          EVALH_HTTP_CONFORMANCE_BASE_URL: http://127.0.0.1:8765
          EVALH_PROVIDER_CONFORMANCE_BASE_URL: http://127.0.0.1:8770
        run: python -m evalharness conformance --all

  no-credential-run:
    name: No-credential run and gate exit codes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the harness with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run both gated specs and assert the exit codes
        env:
          EVALH_HOME: ${{ runner.temp }}/evalh
        run: |
          set -euo pipefail
          # The vault needs a key before any run. This one is ephemeral and
          # unlocks only the disposable CI database; it is not a paid
          # credential and it is never reused outside this job.
          export EVALH_MASTER_KEY="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          python -m evalharness run examples/specs/smoke.yaml --db sqlite:///ci.db
          python -m evalharness run examples/specs/gated.yaml --db sqlite:///ci.db
          set +e
          python -m evalharness run examples/specs/gated-failing.yaml --db sqlite:///ci.db
          code=$?
          set -e
          echo "gated-failing exited $code"
          test "$code" -eq 1

  container-smoke:
    name: Container smoke (health, bootstrap and one no-credential run)
    runs-on: ubuntu-latest
    # Job-level so the failure handlers (logs, teardown) can interpolate the
    # compose file too; a step-scoped variable leaves them failing on cleanup.
    env:
      EVALH_POSTGRES_PASSWORD: ci-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the image
        # The commit goes into the image so a run record names its revision.
        run: docker build --build-arg EVALH_HARNESS_SHA="${{ github.sha }}" -t evalharness:local .
      - name: Validate the compose file without a daemon dependency
        env:
          EVALH_POSTGRES_PASSWORD: ci-not-a-secret
        run: docker compose config > /dev/null
      - name: Bootstrap prints the master key once and exits 2
        env:
          EVALH_POSTGRES_PASSWORD: ci-not-a-secret
        run: |
          set +e
          docker compose run --rm --no-deps -e EVALH_MASTER_KEY= harness \
            > /tmp/bootstrap.log 2>&1
          code=$?
          set -e
          cat /tmp/bootstrap.log
          test "$code" -eq 2
          # 32 bytes urlsafe base64 is 43 characters plus one '='.
          grep -Eq 'EVALH_MASTER_KEY=[A-Za-z0-9_-]{43}=' /tmp/bootstrap.log
      - name: Start the stack with an ephemeral master key
        run: |
          set -euo pipefail
          key="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          # GITHUB_ENV only reaches later steps, so export for this one too.
          echo "EVALH_MASTER_KEY=$key" >> "$GITHUB_ENV"
          export EVALH_MASTER_KEY="$key"
          export EVALH_POSTGRES_PASSWORD=ci-not-a-secret
          docker compose up -d --wait --wait-timeout 120
      - name: Smoke health and one end-to-end no-credential run
        run: |
          docker compose exec -T harness python scripts/smoke.py \
            http://127.0.0.1:8000 --spec smoke.yaml
      - name: Show the stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
