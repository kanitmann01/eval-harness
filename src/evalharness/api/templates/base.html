<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}evalharness console{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5e4b'/%3E%3Cpath d='M9 17l5 5 9-12' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='console.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('run_list') }}">evalharness <span>console</span></a>
    <nav class="site-nav" aria-label="Primary">
      <a class="nav-link" href="{{ url_for('spec_list') }}">Specs</a>
      <a class="nav-link" href="{{ url_for('credential_list') }}"{% if request.url.path == '/credentials' %} aria-current="page"{% endif %}>Credentials</a>
      <a href="{{ url_for('compare') }}"{% if request.url.path == '/compare' %} aria-current="page"{% endif %}>Compare</a>
      <a class="nav-link" href="{{ url_for('launch_page') }}">Launch</a>
    </nav>
    {% if run is defined and run.status == "running" %}
    <form class="nav-cancel" method="post" action="{{ url_for('cancel_run_page', run_id=run.run_id) }}">
      <button type="submit">Cancel run</button>
    </form>
    {% endif %}
    <span class="badge badge-muted" title="One local operator; there is no sign-in or per-user separation.">single user</span>
  </header>
  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Server-rendered console. No client build step, no CDN, no secrets in logs or HTML.</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
