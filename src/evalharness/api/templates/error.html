<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ status_phrase }} &middot; evalharness</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #f7faf8;
    --ink: #17211d;
    --muted: #4b5a53;
    --line: #d7e0da;
    --accent: #1f5e4b;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f1613;
      --ink: #e7efe9;
      --muted: #a9b8b0;
      --line: #2a3a33;
      --accent: #7fd3b2;
      --accent-ink: #06251c;
    }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, sans-serif;
  }
  main {
    max-width: 34rem;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2.5rem;
  }
  .eyebrow {
    margin: 0 0 0.5rem;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0 0 1rem;
    font-size: 1.6rem;
    line-height: 1.2;
  }
  p {
    margin: 0 0 1rem;
    color: var(--muted);
  }
  .status {
    font: 600 0.95rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent);
  }
  a {
    display: inline-block;
    margin-top: 0.5rem;
    min-height: 44px;
    box-sizing: border-box;
    padding: 0.7rem 1.1rem;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    font-weight: 600;
  }
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Error {{ status_code }}</p>
  <h1>{{ status_phrase }}</h1>
  <p>The console could not finish this page.</p>
  <p>{{ message }}</p>
  <p><code class="status">{{ status_code }} {{ status_phrase }}</code></p>
  <a href="/">Back to all runs</a>
</main>
</body>
</html>
