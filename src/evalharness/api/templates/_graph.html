{# Spec graph: the console signature element, rendered as one static SVG. #}
{% macro render_graph(graph, classes='') %}
<svg class="spec-graph {{ classes }}" role="img" aria-label="{{ graph.aria }}" viewBox="0 0 {{ graph.width }} {{ graph.height }}" preserveAspectRatio="xMidYMin meet" xmlns="http://www.w3.org/2000/svg">
  {% for column in graph.columns %}
  <g class="sg-col">
    <text class="sg-col-label" x="{{ column.x }}" y="14">{{ column.label }}</text>
  </g>
  {% endfor %}
  {% for edge in graph.edges %}
  <path class="sg-edge sg-state-{{ edge.state }}" d="{{ edge.path }}" style="stroke-width: {{ edge.stroke_width }}px; stroke-dasharray: {{ edge.dasharray }}"></path>
  {% endfor %}
  {% for node in graph.nodes %}
  <g class="sg-node sg-tone-{{ node.tone }}">
    <rect x="{{ node.x }}" y="{{ node.y }}" width="{{ node.w }}" height="{{ node.h }}" rx="2"></rect>
    <text class="sg-label" x="{{ node.x }}" y="{{ node.y }}" transform="translate(8 16)">{{ node.label }}</text>
    <text class="sg-detail" x="{{ node.x }}" y="{{ node.y }}" transform="translate(8 30)">{{ node.detail }}</text>
  </g>
  {% endfor %}
</svg>
{% endmacro %}
