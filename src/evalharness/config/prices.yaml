# Shipped default prices for the first-party provider adapters.
#
# USD per million tokens, keyed by provider then model. A spec may override
# one entry under provider_prices:, or a model-only entry under prices:, and
# its override always wins over this file. A declared model with no price
# anywhere is a validation error naming the model.
#
# These are representative list prices; update them when a provider changes
# its rates. The run snapshot records the resolved table, so an old run keeps
# the prices it was launched with.

openai-compatible:
  gpt-4o-mini:
    input: 0.15
    output: 0.60
  gpt-4.1-mini:
    input: 0.40
    output: 1.60
  gpt-4o:
    input: 2.50
    output: 10.00

anthropic:
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
  claude-sonnet-4-5:
    input: 3.00
    output: 15.00
  claude-opus-4-1:
    input: 15.00
    output: 75.00
