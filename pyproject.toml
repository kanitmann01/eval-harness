[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evalharness"
version = "0.2.0"
description = "Adapter-based evaluation harness: spec-driven runs, BYOK credentials, results console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "cryptography>=42.0",
  "httpx>=0.27",
  # FastAPI parses the spec editor and credentials forms through this parser;
  # without it a fresh install boots but every form post raises at request time.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
evalh = "evalharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evalharness.api" = ["templates/*.html", "templates/**/*.html", "static/*"]
"evalharness.config" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config --cov=evalharness --cov-report=term-missing:skip-covered --cov-fail-under=100"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
